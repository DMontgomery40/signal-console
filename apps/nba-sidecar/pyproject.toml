[project]
name = "nba-sidecar"
version = "0.1.0"
description = "Python nba_api sidecar for normalized NBA game-state, box score, and play-by-play payloads."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "nba_api>=1.11.4,<2",
  "pydantic>=2.11,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]
# Optional research/quant-lab dependencies. These are NOT required to run the
# base nba-sidecar service; they are only needed for the offline research
# package under src/nba_sidecar/research/ (snapshot loading, model iteration,
# evaluation). Install with `uv sync --extra research`.
research = [
  "pandas>=2.2,<3",
  "pyarrow>=16,<22",
  "duckdb>=1.0,<2",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  # Notebook authoring + headless execution for the `bootstrap` subcommand
  # (writes notebooks/quant-lab-starter.ipynb) and its nbconvert validation.
  "nbformat>=5.10,<6",
  "nbconvert>=7.16,<8",
  "ipykernel>=6.29,<7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.signal-console.scripts]
typecheck = "python -m compileall -q src tests"
verify = "python -m pip install --disable-pip-version-check -e '.[dev]' && python -m pytest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
